name: Release

on:
  push:
    tags:
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Get version
        id: tag_version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="$TAG_NAME"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Tag version $VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare prebuilt package and release archives
        run: |
          # Build the setup assets into the release package, then remove downloads not needed at runtime.
          pnpm run postinstall
          rm -rf obsidian-e2e-toolkit-assets/cache

          mkdir -p release-package release-artifacts
          cp -R dist scripts obsidian-e2e-toolkit-assets release-package/
          cp README.md LICENSE package.json release-package/

          # Keep release-only lifecycle changes inside the tarball so source tags stay on main's history.
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'release-package/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete pkg.scripts.prepare;
          delete pkg.scripts.postinstall;
          if (!pkg.files.includes('obsidian-e2e-toolkit-assets')) {
            pkg.files.push('obsidian-e2e-toolkit-assets');
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 4) + '\n');
          NODE

          npm pack ./release-package --pack-destination ./release-artifacts
          tar -czf "release-artifacts/obsidian-e2e-toolkit-${{ steps.tag_version.outputs.VERSION }}.tar.gz" -C release-package .
          cd release-artifacts
          sha256sum *.tgz *.tar.gz > checksums.txt

      - name: Generate Release Notes
        id: release_notes
        run: |
          TAG_NAME="${{ steps.tag_version.outputs.TAG_NAME }}"
          VERSION="${{ steps.tag_version.outputs.VERSION }}"
          # Version tags can include an older prebuilt tag whose commit is not on main.
          PREV_TAG=$(git tag --sort=-version:refname | awk -v current="$TAG_NAME" '
            $0 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ {
              if (found) { print; exit }
              if ($0 == current) found = 1
            }
          ')

          if [ -z "$PREV_TAG" ]; then
            echo "NOTES<<EOF" >> $GITHUB_OUTPUT
            echo "## What's New" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "Initial release of Obsidian E2E Toolkit" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Features" >> $GITHUB_OUTPUT
            echo "- Complete E2E testing toolkit for Obsidian plugins" >> $GITHUB_OUTPUT
            echo "- Playwright integration" >> $GITHUB_OUTPUT
            echo "- Automated setup script" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Installation (Pre-built)" >> $GITHUB_OUTPUT
            echo "ビルド済みの成果物が含まれているため、追加の設定なしでインストールできるっす！" >> $GITHUB_OUTPUT
            echo '```bash' >> $GITHUB_OUTPUT
            echo "pnpm add -D https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/obsidian-e2e-toolkit-${VERSION}.tgz" >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            PREV_BASE=$(git merge-base "$PREV_TAG" "$TAG_NAME")
            echo "NOTES<<EOF" >> $GITHUB_OUTPUT
            echo "## What's Changed" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            git log "$PREV_BASE..$TAG_NAME" --pretty=format:"- %s (%h)" --no-merges >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Installation (Pre-built)" >> $GITHUB_OUTPUT
            echo "ビルド済みの成果物が含まれているため、追加の設定なしでインストールできるっす！" >> $GITHUB_OUTPUT
            echo '```bash' >> $GITHUB_OUTPUT
            echo "pnpm add -D https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/obsidian-e2e-toolkit-${VERSION}.tgz" >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_BASE...$TAG_NAME" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.tag_version.outputs.TAG_NAME }}
          body: ${{ steps.release_notes.outputs.NOTES }}
          files: |
            release-artifacts/*.tgz
            release-artifacts/*.tar.gz
            release-artifacts/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "### 🎉 Release ${{ steps.tag_version.outputs.TAG_NAME }} created successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Installation (Pre-built)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "pnpm add -D https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_version.outputs.TAG_NAME }}/obsidian-e2e-toolkit-${{ steps.tag_version.outputs.VERSION }}.tgz" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Release Page](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag_version.outputs.TAG_NAME }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Source Code](https://github.com/${{ github.repository }}/tree/${{ steps.tag_version.outputs.TAG_NAME }})" >> $GITHUB_STEP_SUMMARY
