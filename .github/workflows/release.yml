name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Get version
        id: tag_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${{ github.event.inputs.version }}"
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release Branch and Push
        run: |
          # 1. 必要なアセットをすべて揃えるっす (Obsidian のバイナリ等)
          pnpm run postinstall

          # 【重要】GitHub の 100MB 回避策：
          # obsidian-e2e-toolkit-assets/cache にあるダウンロード済みの巨大な tar.gz や asar は削除するっす！
          # インストール後に必要なのは unpacked された中身だけなので、これでサイズを大幅に削れるっす。
          rm -rf obsidian-e2e-toolkit-assets/cache

          # 2. リリース用ブランチの準備
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # 3. 消費者側でのエラーを回避するために package.json を加工するっす
          # - prepare/postinstall を消すことで再ビルドを防止
          # - obsidian-e2e-toolkit-assets を files に追加して、インストール時に消されないようにするっす！
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); delete pkg.scripts.prepare; delete pkg.scripts.postinstall; if (pkg.files && !pkg.files.includes('obsidian-e2e-toolkit-assets')) { pkg.files.push('obsidian-e2e-toolkit-assets') }; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2))"

          # 4. 作業用の一時的なインデックスを作成して、配布に必要なファイルだけを入れるっす
          git checkout -b release-temp
          git add -f dist/
          git add -f obsidian-e2e-toolkit-assets/
          git add package.json README.md LICENSE
          
          git commit -m "Release version ${{ steps.tag_version.outputs.VERSION }} (pre-built, cache cleaned)"
          
          # 5. タグを上書きプッシュするっす
          git tag -f ${{ steps.tag_version.outputs.TAG_NAME }}
          git push -f origin ${{ steps.tag_version.outputs.TAG_NAME }}

      - name: Create Release Archive
        # 成果物（dist 等）が含まれた状態でアーカイブを作成するように cd して実行するっす
        run: |
          mkdir -p release-artifacts
          tar -czf release-artifacts/obsidian-e2e-toolkit-${{ steps.tag_version.outputs.VERSION }}.tar.gz \
            dist/ \
            obsidian-e2e-toolkit-assets/ \
            README.md \
            LICENSE \
            package.json

          cd release-artifacts
          sha256sum obsidian-e2e-toolkit-${{ steps.tag_version.outputs.VERSION }}.tar.gz > checksums.txt

      - name: Generate Release Notes
        id: release_notes
        run: |
          TAG_NAME="${{ steps.tag_version.outputs.TAG_NAME }}"
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "NOTES<<EOF" >> $GITHUB_OUTPUT
            echo "## What's New" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "Initial release of Obsidian E2E Toolkit" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Features" >> $GITHUB_OUTPUT
            echo "- Complete E2E testing toolkit for Obsidian plugins" >> $GITHUB_OUTPUT
            echo "- Playwright integration" >> $GITHUB_OUTPUT
            echo "- Automated setup script" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Installation (Pre-built)" >> $GITHUB_OUTPUT
            echo "ビルド済みの成果物が含まれているため、追加の設定なしでインストールできるっす！" >> $GITHUB_OUTPUT
            echo '```bash' >> $GITHUB_OUTPUT
            echo "pnpm add github:22-2/obsidian-e2e-toolkit#${TAG_NAME}" >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "NOTES<<EOF" >> $GITHUB_OUTPUT
            echo "## What's Changed" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            git log "$PREV_TAG..$TAG_NAME" --pretty=format:"- %s (%h)" --no-merges >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### Installation (Pre-built)" >> $GITHUB_OUTPUT
            echo "ビルド済みの成果物が含まれているため、追加の設定なしでインストールできるっす！" >> $GITHUB_OUTPUT
            echo '```bash' >> $GITHUB_OUTPUT
            echo "pnpm add github:${{ github.repository }}#${TAG_NAME}" >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG_NAME" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.tag_version.outputs.TAG_NAME }}
          body: ${{ steps.release_notes.outputs.NOTES }}
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "### 🎉 Release ${{ steps.tag_version.outputs.TAG_NAME }} created successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Installation (Pre-built)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "pnpm add github:${{ github.repository }}#${{ steps.tag_version.outputs.TAG_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Release Page](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag_version.outputs.TAG_NAME }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Source Code (Pre-built tag)](https://github.com/${{ github.repository }}/tree/${{ steps.tag_version.outputs.TAG_NAME }})" >> $GITHUB_STEP_SUMMARY
