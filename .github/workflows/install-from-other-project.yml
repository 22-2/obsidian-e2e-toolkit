name: Test install from other project

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  install-from-other:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies and build package
        run: |
          pnpm install
          pnpm build
          # ここでセットアップも実行して、obsidian-e2e-toolkit-assets を生成しておくっす
          pnpm run postinstall

      - name: Create a consumer project and install this package from local clone
        # release.yml の挙動をシミュレートするために、
        # dist と .obsidian-e2e-toolkit を含み、ビルドスクリプトを削った状態のリポジトリを作るっす！
        run: |
          # 1. 現在のビルド結果を含めたダミーのGitリモートを作成するっす
          git clone . ../remote-repo
          
          # ビルド済みの dist とアセットをコピーするっす
          cp -r dist ../remote-repo/
          cp -r obsidian-e2e-toolkit-assets ../remote-repo/
          
          cd ../remote-repo
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # release.yml と同様に、package.json からビルド関連スクリプトを削除するっす！
          # これにより、onlyBuiltDependencies の設定なしでインストール可能になるっす
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); delete pkg.scripts.prepare; delete pkg.scripts.postinstall; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2))"

          # 成果物を強制的にコミットに加えるっす
          git add -f dist/
          git add -f obsidian-e2e-toolkit-assets/
          git add package.json
          git commit -m "Simulate release state (pre-built assets & no scripts)"
          cd -
          
          # 2. 消費者プロジェクトの作成
          mkdir consumer
          cd consumer
          pnpm init
          
          echo "Debug: Listing remote repo contents before install"
          ls -la ../remote-repo
          ls -R ../remote-repo/obsidian-e2e-toolkit-assets || echo "Assets not in remote-repo"

          echo "Installing from local git clone (pre-built state)..."
          pnpm add -D "git+file://$(realpath ../../remote-repo)"

          echo "Debug: checking node_modules content"
          ls -la node_modules/obsidian-e2e-toolkit
          ls -R node_modules/obsidian-e2e-toolkit/dist
          
          # セットアップを実行しなくても、すでにアセットが含まれているか確認するっす
          echo "Debug: checking unpacked assets"
          ls -la node_modules/obsidian-e2e-toolkit/obsidian-e2e-toolkit-assets || echo "Assets folder missing in node_modules"
          ls -R node_modules/obsidian-e2e-toolkit/obsidian-e2e-toolkit-assets/obsidian-unpacked || echo "Unpacked assets missing"

          echo "Verifying dist access..."
          node -e "import('obsidian-e2e-toolkit').then((m)=>console.log('import ok keys:', Object.keys(m))).catch(e=>{console.error(e); process.exit(1)})"

      - name: Cleanup remote repo
        if: always()
        run: rm -rf ../remote-repo
