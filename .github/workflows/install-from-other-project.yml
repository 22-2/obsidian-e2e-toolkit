name: Test install from other project

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  install-from-other:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies and build package
        run: |
          pnpm install
          pnpm build

      - name: Create a consumer project and install this package from local clone
        # git+https... で自分自身をインストールしようとすると、CI上では
        # 「まだプッシュされていない最新のコミット」が取得できないため、
        # ローカルのディレクトリを別の場所にクローンして、そこを「リモートリポジトリ」に見立ててテストするっす！
        run: |
          # 1. 現在のビルド結果(dist)を含めたダミーのGitリモートを作成するっす
          git clone . ../remote-repo
          
          # 【修正点】ビルド済みの dist を手動でコピーしてくるっす
          cp -r dist ../remote-repo/
          
          cd ../remote-repo
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          
          # distを強制的にコミットに加えることで、Release時のタグと同じ状態を再現するっす！
          git add -f dist/
          git commit -m "Simulate release state with dist"
          cd -
          
          # 2. 消費者プロジェクトの作成
          mkdir consumer
          cd consumer
          pnpm init
          
          echo "Installing from local git clone (with committed dist)..."
          pnpm add -D "git+file://$(realpath ../../remote-repo)"

          echo "Debug: checking node_modules content"
          ls -R node_modules/obsidian-e2e-toolkit/dist
          
          echo "Verifying dist access..."
          node -e "import('obsidian-e2e-toolkit').then((m)=>console.log('import ok keys:', Object.keys(m))).catch(e=>{console.error(e); process.exit(1)})"

      - name: Cleanup remote repo
        if: always()
        run: rm -rf ../remote-repo
