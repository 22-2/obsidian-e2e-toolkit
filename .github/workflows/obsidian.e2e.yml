name: Obsidian E2E Test

on:
  workflow_dispatch:
    inputs:
      obsidian_version:
        description: "Obsidian desktop version or latest"
        default: "1.14.4"
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OBSIDIAN_E2E_TOOLKIT_OBSIDIAN_VERSION: ${{ github.event.inputs.obsidian_version || '1.14.4' }}

jobs:
  e2e-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache Obsidian assets
        uses: actions/cache@v5
        with:
          path: obsidian-e2e-toolkit-assets
          key: ${{ runner.os }}-obsidian-smoke-${{ env.OBSIDIAN_E2E_TOOLKIT_OBSIDIAN_VERSION }}

      - name: Install dependencies
        # This library does not track a lockfile; consumer projects keep their own locked dependencies.
        run: pnpm install --no-lockfile

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium

      # Electron provides Chromium; the smoke test does not need a separate browser download.
      - name: Run Obsidian smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a pnpm run test:e2e:smoke
          else
            pnpm run test:e2e:smoke
          fi

      - name: Upload Playwright report and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: obsidian-smoke-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
