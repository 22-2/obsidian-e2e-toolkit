name: Obsidian E2E Test

on:
  workflow_dispatch:

jobs:
  e2e-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            %LOCALAPPDATA%/ms-playwright  # Windows
            ~/Library/Caches/ms-playwright # macOS

          key: ${{ runner.os }}-playwright-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright
        run: pnpm playwright install chromium

      - name: PWD # For debugging purposes
        shell: bash
        run: |
          pwd

      - name: Run Playwright example tests
        run: pnpm run test:e2e:example
        env:
          DEBUG: "pw:browser"
      - name: Run Playwright minimal main test
        run: pnpm run test:e2e:minimal-main
        env:
          DEBUG: "pw:browser"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 30
